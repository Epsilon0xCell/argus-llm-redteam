[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-llm-redteam"
version = "1.0.0"
description = "Argus: an LLM red-team evaluation harness with objective canary scoring, measured defenses, and sealed hold-out attack sets. For models you own or run locally."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["argus*"]
